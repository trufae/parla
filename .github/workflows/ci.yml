name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            libwebkitgtk-6.0-dev

      - name: Setup
        run: meson setup builddir -Dwebxdc=true

      - name: Build
        run: meson compile -C builddir

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            libwebkitgtk-6.0-dev \
            make \
            dpkg-dev

      - name: Build
        run: make WITH_WEBXDC=1

      - name: Package .deb
        run: make deb WITH_WEBXDC=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-deb
          path: dist/debian/parla/*.deb

  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: ${{ matrix.arch }}
          manifest-path: dist/flatpak/io.github.trufae.Parla.json
          bundle: parla-${{ matrix.arch }}.flatpak
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('dist/flatpak/io.github.trufae.Parla.json') }}

  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            make \
            curl \
            python3

      - name: Package AppImage
        run: make appimage ARCH=${{ matrix.arch }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-appimage-${{ matrix.arch }}
          path: dist/appimage/out/*.AppImage
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        # dmgname is the user-facing suffix of the released DMG:
        # Parla-<version>-<dmgname>.dmg
        include:
          - arch: arm64
            runner: macos-26
            dmgname: macos-arm64
          - arch: x86_64
            runner: macos-26-intel
            dmgname: macos-intel
          - arch: arm64
            runner: macos-14
            dmgname: macos-arm64-legacy
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install \
            meson \
            ninja \
            vala \
            pkgconf \
            gtk4 \
            libadwaita \
            json-glib \
            librsvg \
            webp-pixbuf-loader \
            glib-networking \
            adwaita-icon-theme

      # VoiceOver only sees GTK through its AccessKit backend, which
      # Homebrew's gtk4 does not enable, so the library is rebuilt
      # with it (scripts/macos/gtk4-accesskit.sh). The cache keys on
      # the installed gtk4 version, so the rebuild happens once per
      # gtk4 release and runner flavor.
      - name: Compute gtk4 rebuild cache key
        id: gtk4
        run: echo "version=$(brew list --versions gtk4 | awk '{ print $2; exit }')" >> "$GITHUB_OUTPUT"

      - name: Cache AccessKit-enabled GTK libraries
        uses: actions/cache@v4
        with:
          path: .cache/macos-a11y-libs
          key: macos-gtk4-accesskit-${{ matrix.dmgname }}-${{ steps.gtk4.outputs.version }}

      - name: Rebuild gtk4 with the AccessKit a11y backend
        run: scripts/macos/gtk4-accesskit.sh

      - name: Build
        run: make BUILDTYPE=release WITH_WEBXDC=1

      - name: Package ZIP
        id: zip
        env:
          ARCH: ${{ matrix.arch }}
          WITH_WEBXDC: "1"
        run: scripts/macos/package-zip.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-${{ matrix.dmgname }}-zip
          path: Parla-*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep LF endings or bash scripts break inside MSYS2.
      - name: Configure git line endings
        run: git config --global core.autocrlf input
        shell: bash

      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            unzip
            curl
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
            mingw-w64-ucrt-x86_64-ntldd

      # Windows screen readers only see GTK through its AccessKit
      # backend, which MSYS2's gtk4 does not enable, so the package is
      # rebuilt with it (scripts/windows/gtk4-accesskit.sh). The cache
      # keys on the upstream PKGBUILD version the script builds from,
      # so the ~30 minute rebuild happens once per gtk4 release.
      - name: Compute gtk4 rebuild cache key
        id: gtk4
        run: |
          ver="$(curl -sSL https://raw.githubusercontent.com/msys2/MINGW-packages/master/mingw-w64-gtk4/PKGBUILD \
            | awk -F= '/^pkgver=/ { v = $2 } /^pkgrel=/ { r = $2 } END { print v "-" r }')"
          if [ -z "$ver" ] || [ "$ver" = "-" ]; then
            ver="$(pacman -Si mingw-w64-ucrt-x86_64-gtk4 | awk '/^Version/ { print $3; exit }')"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Cache AccessKit-enabled gtk4 packages
        uses: actions/cache@v4
        with:
          path: .cache/msys2-a11y-pkgs
          key: msys2-gtk4-accesskit-${{ steps.gtk4.outputs.version }}

      - name: Rebuild gtk4 with the AccessKit a11y backend
        run: bash scripts/windows/gtk4-accesskit.sh

      - name: Build and bundle
        run: WITH_WEBXDC=1 bash scripts/windows/bundle.sh

      - name: Run tests
        run: meson test -C builddir-windows --print-errorlogs

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-windows-x86_64
          path: dist/windows/*.zip
          if-no-files-found: error

  macos-sign:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
    runs-on: macos-latest
    environment: release
    # Environment secrets for signing:
    #   APPLE_DEVELOPER_CERTIFICATE_P12_BASE64:
    #     Base64 of the p12 export (cert+private key), the certificate must be named
    #     "Developer ID Application: DEVELOPER_NAME (TEAM_ID)"
    #   APPLE_DEVELOPER_CERTIFICATE_PASSWORD: Random password used to encrypt the exported P12
    # Environment secrets for notarization:
    #   APPLE_DEVELOPER_ID: email of the developer
    #   APPLE_TEAM_ID: Team ID (can be extracted from the certificate name too)
    #   APPLE_APP_SPECIFIC_PASSWORD: https://support.apple.com/en-us/102654
    steps:      
      - name: Install dependencies
        run: brew install create-dmg

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: parla-macos-*-zip
          path: artifacts
       
      - name: Install Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "keychainpass-${{ github.run_id }}"
        run: ./scripts/macos/ci-keychain.sh

      - name: Sign and package the App Bundle
        run: ./scripts/macos/ci-sign.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/macos/ci-notarize.sh

      - uses: actions/upload-artifact@v7
        with:
          name: parla-macos-signed
          path: ./*.dmg
          if-no-files-found: error

      - name: Remove keychain
        if: always()
        run: security delete-keychain release.keychain

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, build-flatpak, build-appimage, macos-sign, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify release artifacts
        run: |
          shopt -s nullglob globstar
          debs=(artifacts/**/*.deb)
          flatpaks=(artifacts/**/*.flatpak)
          appimages=(artifacts/**/*.AppImage)
          # One DMG per entry in the build-macos matrix
          dmgs=(artifacts/parla-macos-signed/*.dmg)
          zips=(artifacts/parla-windows-*/*.zip)
          if (( ${#debs[@]} == 0 || ${#flatpaks[@]} == 0 || ${#appimages[@]} == 0 || ${#dmgs[@]} != 3 || ${#zips[@]} == 0 )); then
            find artifacts -maxdepth 4 -type f
            echo "::error::Missing release artifact (.deb, .flatpak, three .dmg files, .AppImage, or .zip)"
            exit 1
          fi
          declare -A dmg_names
          for dmg in "${dmgs[@]}"; do
            name=${dmg##*/}
            if [[ -n "${dmg_names[$name]:-}" ]]; then
              echo "::error::Duplicate DMG release name: $name"
              exit 1
            fi
            dmg_names[$name]=1
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.flatpak
            artifacts/**/*.AppImage
            artifacts/parla-macos-signed/*.dmg
            artifacts/parla-windows-*/*.zip
