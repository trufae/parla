name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev

      - name: Setup
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            make \
            dpkg-dev

      - name: Build
        run: make

      - name: Package .deb
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-deb
          path: dist/debian/parla/*.deb

  build-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: dist/flatpak/io.github.trufae.Parla.json
          bundle: parla.flatpak
          cache-key: flatpak-builder-${{ hashFiles('dist/flatpak/io.github.trufae.Parla.json') }}

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install \
            meson \
            ninja \
            vala \
            pkgconf \
            gtk4 \
            libadwaita \
            json-glib \
            librsvg \
            glib-networking \
            adwaita-icon-theme \
            create-dmg

      - name: Build
        run: scripts/macos/build.sh

      - name: Package DMG
        id: dmg
        run: |
          version=$(awk -F"'" '/version:/ { print $2; exit }' meson.build)
          VERSION="$version" scripts/macos/package-dmg.sh | tee /tmp/parla-dmg.log
          dmg=$(tail -n 1 /tmp/parla-dmg.log)
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-macos-dmg
          path: ${{ steps.dmg.outputs.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, build-flatpak, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.flatpak
            artifacts/**/*.dmg
