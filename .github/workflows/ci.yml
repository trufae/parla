name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev

      - name: Setup
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            make \
            dpkg-dev

      - name: Build
        run: make

      - name: Package .deb
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-deb
          path: dist/debian/parla/*.deb

  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: ${{ matrix.arch }}
          manifest-path: dist/flatpak/io.github.trufae.Parla.json
          bundle: parla-${{ matrix.arch }}.flatpak
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('dist/flatpak/io.github.trufae.Parla.json') }}

  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            valac \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libjson-glib-dev \
            make \
            curl \
            python3

      - name: Package AppImage
        run: make appimage ARCH=${{ matrix.arch }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-appimage-${{ matrix.arch }}
          path: dist/appimage/out/*.AppImage
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install \
            meson \
            ninja \
            vala \
            pkgconf \
            gtk4 \
            libadwaita \
            json-glib \
            librsvg \
            webp-pixbuf-loader \
            glib-networking \
            adwaita-icon-theme

      - name: Build
        run: make BUILDTYPE=release

      - name: Package ZIP
        id: zip
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/macos/package-zip.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-macos-${{ matrix.runner }}-${{ matrix.arch }}-zip
          path: Parla-*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep LF endings or bash scripts break inside MSYS2.
      - name: Configure git line endings
        run: git config --global core.autocrlf input
        shell: bash

      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build and bundle
        run: bash scripts/windows/bundle.sh

      - name: Run tests
        run: meson test -C builddir-windows --print-errorlogs

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: parla-windows-x86_64
          path: dist/windows/*.zip
          if-no-files-found: error

  macos-sign:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
    runs-on: macos-latest
    environment: release
    # Environment secrets for signing:
    #   APPLE_DEVELOPER_CERTIFICATE_P12_BASE64:
    #     Base64 of the p12 export (cert+private key), the certificate must be named
    #     "Developer ID Application: DEVELOPER_NAME (TEAM_ID)"
    #   APPLE_DEVELOPER_CERTIFICATE_PASSWORD: Random password used to encrypt the exported P12
    # Environment secrets for notarization:
    #   APPLE_DEVELOPER_ID: email of the developer
    #   APPLE_TEAM_ID: Team ID (can be extracted from the certificate name too)
    #   APPLE_APP_SPECIFIC_PASSWORD: https://support.apple.com/en-us/102654
    steps:      
      - name: Install dependencies
        run: brew install create-dmg

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: parla-macos-*-zip
          path: artifacts
       
      - name: Install Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "keychainpass-${{ github.run_id }}"
        run: |
          # Create keychain
          security create-keychain -p "${KEYCHAIN_PASSWORD}" release.keychain
          security default-keychain -s release.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" release.keychain
          security set-keychain-settings -t 3600 -u release.keychain
          
          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k release.keychain -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" release.keychain
          
          # Check if the certificate was imported correctly and find its identity
          security find-identity -v -p codesigning release.keychain
          
          # Clean up
          rm certificate.p12

      - name: Sign and package the App Bundle
        run: |
          # Find the Developer ID Application certificate identity
          IDENTITY=$(security find-identity -v -p codesigning | awk '/Developer ID Application/{print $2;exit}')
          
          if [ -z "$IDENTITY" ]; then
            echo "Error: No Developer ID Application certificate found in keychain"
            exit 1
          fi

          # Sign and package for all builds
          for folder in artifacts/*; do
            build=$(echo "$folder" | sed -e 's,artifacts/parla-,,' -e 's,-zip$,,')
            
            echo "[${build}] Extracting build..."
            disk="disks/${build}/"
            zip=$(echo "${folder}/"Parla*.zip)
            zipname=$(basename ${zip} .zip)
            mkdir -p "${disk}"
            ditto -x -k "${zip}" "${disk}"

            echo "[${build}] Signing app bundle..."
            app="${disk}/Parla.app"
            codesign --force --deep --options runtime --entitlements "scripts/macos/release.entitlements" --sign "$IDENTITY" "${app}"
            codesign --verify --verbose "${app}"

            dmg="${zipname}-${build}.dmg"
            echo "[${build}] Packaging into ${dmg}..."
            create-dmg \
                --volname "Parla" \
                --window-pos 200 120 \
                --window-size 600 400 \
                --icon-size 100 \
                --icon "Parla.app" 150 185 \
                --app-drop-link 450 185 \
                --no-internet-enable \
                "${dmg}" \
                "disks/${build}/"

            echo "[${build}] Signing ${dmg}..."
            codesign --force --sign "$IDENTITY" --timestamp "${dmg}"
          done

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for dmg in *.dmg; do
            echo "Notary $dmg..."
            xcrun notarytool submit "${dmg}" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
            xcrun stapler staple "${dmg}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: parla-macos-signed
          path: ./*.dmg
      
      - name: Remove keychain
        if: always()
        run: security delete-keychain release.keychain

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, build-flatpak, build-appimage, macos-sign, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify release artifacts
        run: |
          shopt -s nullglob globstar
          debs=(artifacts/**/*.deb)
          flatpaks=(artifacts/**/*.flatpak)
          appimages=(artifacts/**/*.AppImage)
          dmgs=(artifacts/parla-macos-signed/*.dmg)
          zips=(artifacts/parla-windows-*/*.zip)
          if (( ${#debs[@]} == 0 || ${#flatpaks[@]} == 0 || ${#appimages[@]} == 0 || ${#dmgs[@]} != 3 || ${#zips[@]} == 0 )); then
            find artifacts -maxdepth 4 -type f
            echo "::error::Missing release artifact (.deb, .flatpak, three .dmg files, .AppImage, or .zip)"
            exit 1
          fi
          declare -A dmg_names
          for dmg in "${dmgs[@]}"; do
            name=${dmg##*/}
            if [[ -n "${dmg_names[$name]:-}" ]]; then
              echo "::error::Duplicate DMG release name: $name"
              exit 1
            fi
            dmg_names[$name]=1
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.flatpak
            artifacts/**/*.AppImage
            artifacts/parla-macos-signed/*.dmg
            artifacts/parla-windows-*/*.zip
